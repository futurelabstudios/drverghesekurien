title: Dr. Verghese Kurien — The People's Archive
description: An open-source, community-built archive of the life, institutions, ideas and memories of Dr. Verghese Kurien (1921–2012), Father of India's White Revolution.
url: "https://futurelabstudios.github.io"
baseurl: "/drverghesekurien"
lang: en

plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Image library (Wikimedia Commons, free licences) — credits on media/photos page
img_base: "https://commons.wikimedia.org/wiki/Special:FilePath/"

footer_content: "Text licensed CC BY-SA 4.0 unless noted. Media remain the property of their owners and are shared with permission. Built by the community; started by Futurelab Studios."

relative_links:
  enabled: true
  collections: false

# These filenames are skipped by jekyll-optional-front-matter unless included.
# The homepage already links to /CONTRIBUTING.html.
include:
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md

exclude:
  - "memories/_TEMPLATE.md"
  - "media/_TEMPLATE.md"
  - ".github"
  - "vendor"
